<svg width="602" height="866" viewBox="0 0 602 866" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <mask id="borderMask">
      <!-- Фон чёрный = бордер невидим -->
      <rect width="602" height="866" fill="black" />
      
      <!-- 1. Нижняя часть стрелочки (от низа почти до середины) -->
      <!-- Нижний левый угол -->
      <linearGradient id="bottomLeftGrad" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0%" stop-color="white" />
        <stop offset="40%" stop-color="white" />
        <stop offset="70%" stop-color="black" />
        <stop offset="100%" stop-color="black" />
      </linearGradient>
      <rect x="0" y="400" width="400" height="566" fill="url(#bottomLeftGrad)" />
      
      <!-- Нижний правый угол -->
      <linearGradient id="bottomRightGrad" x1="1" y1="1" x2="1" y2="0">
        <stop offset="0%" stop-color="white" />
        <stop offset="40%" stop-color="white" />
        <stop offset="70%" stop-color="black" />
        <stop offset="100%" stop-color="black" />
      </linearGradient>
      <rect x="300" y="400" width="502" height="766" fill="url(#bottomRightGrad)" />
      
      <!-- 2. Левая граница (от середины чуть-чуть вверх) -->
      <linearGradient id="leftGrad" x1="1" y1="0" x2="0.7" y2="0.9">
        <stop offset="0%" stop-color="black" />
        <stop offset="50%" stop-color="white" />
        <stop offset="100%" stop-color="black" />
      </linearGradient>
      <rect x="0" y="260" width="550" height="280" fill="url(#leftGrad)" />
      
      <!-- 3. Правая граница (от верха до середины) -->
      <linearGradient id="rightGrad" x1="1" y1="0" x2="1" y2="0.8">
        <stop offset="0%" stop-color="black" />
        <stop offset="40%" stop-color="white" />
        <stop offset="100%" stop-color="black" />
      </linearGradient>
      <rect x="350" y="0" width="452" height="740" fill="url(#rightGrad)" />
    </mask>
  </defs>
  
  <!-- Основная фигура с полупрозрачной заливкой -->
  <path d="M396.214 5.7186C337.384 -18.3765 277.43 37.7348 297.582 98.0292L414.05 446.51C428.64 490.165 409.079 537.923 368.058 558.8L40.6015 725.461C-16.0554 754.296 -12.6875 836.343 46.1421 860.438C66.1139 868.618 88.6555 867.71 107.905 857.95L550.392 633.596C591.541 612.732 611.156 564.841 596.465 521.106L438.486 50.8167C431.614 30.3581 416.185 13.8986 396.214 5.7186Z" fill="white" fill-opacity="0.12" />
  
  <!-- Бордер с маской -->
  <path d="M396.214 5.7186C337.384 -18.3765 277.43 37.7348 297.582 98.0292L414.05 446.51C428.64 490.165 409.079 537.923 368.058 558.8L40.6015 725.461C-16.0554 754.296 -12.6875 836.343 46.1421 860.438C66.1139 868.618 88.6555 867.71 107.905 857.95L550.392 633.596C591.541 612.732 611.156 564.841 596.465 521.106L438.486 50.8167C431.614 30.3581 416.185 13.8986 396.214 5.7186Z" stroke="white" stroke-width="1" mask="url(#borderMask)" />
